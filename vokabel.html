<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vokabel-Held 🦸‍♂️</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #aufgabe { font-size: 2.5rem !important; min-height: 120px; display: flex; align-items: center; justify-content: center; word-break: break-word; line-height: 1.2; margin: 20px 0; padding: 15px; }
        #antwort-input { width: 90%; padding: 18px; font-size: 1.4rem; border: 4px solid var(--dark); border-radius: 20px; text-align: center; font-family: 'Arial Black', sans-serif; margin-bottom: 10px; background: #e3f2fd; box-shadow: 0 4px 0 var(--dark); }
        #sprach-modus, #klassen-stufe { width: 95%; padding: 15px; font-size: 1.2rem; border: 4px solid var(--dark); border-radius: 20px; font-family: 'Arial Black', sans-serif; margin-bottom: 20px; background-color: white; cursor: pointer; }
        .btn-full { width: 100%; margin-top: 10px; }
        #ergebnis-text { max-height: 500px; overflow-y: auto; padding: 10px; text-align: center; }
        .fehler-box { margin-top: 20px; text-align: left; font-size: 1.1rem; background: #fff3cd; padding: 15px; border: 3px solid var(--dark); border-radius: 15px; box-shadow: 4px 4px 0 var(--dark); }
        .note-display { font-size: 4rem; margin: 15px 0; font-family: 'Arial Black', sans-serif; text-shadow: 2px 2px 0 var(--dark); }
        
        #gutschein-anzeige {
            display: none;
            margin: 20px 0;
            padding: 20px;
            background: #ffeb3b;
            border: 5px dashed var(--dark);
            border-radius: 15px;
            color: var(--dark);
            font-family: 'Arial Black', sans-serif;
            box-shadow: 8px 8px 0 var(--comic-pink);
        }
        .gutschein-titel { font-size: 1.5rem; text-decoration: underline; margin-bottom: 10px; }
        .gutschein-zeit { font-size: 2rem; color: #e91e63; }
        .gutschein-info { font-size: 0.8rem; margin-top: 10px; border-top: 2px solid var(--dark); padding-top: 5px; font-family: sans-serif; font-weight: normal; }
    </style>
</head>
<body>

<div class="container">
    <div id="start-screen">
        <h1>Vokabel-Held ✍️</h1>
        <input type="text" id="spieler-name" placeholder="Dein Name">
        <h3>Klassenstufe:</h3>
        <select id="klassen-stufe">
            <option value="vocabulary_klasse3.json">Klasse 3</option>
            <option value="vocabulary_klasse4.json">Klasse 4</option>
            <option value="vocabulary.json" selected>Klasse 5</option>
            <option value="vocabulary_klasse6.json">Klasse 6</option>
        </select>
        <h3>Abfragemodus:</h3>
        <select id="sprach-modus">
            <option value="en_de">Englisch ➔ Deutsch</option>
            <option value="de_en">Deutsch ➔ Englisch</option>
            <option value="mix">Gemixt 🔄</option>
        </select>
        <button class="num-btn ok-btn btn-full" onclick="starteTraining()">STARTEN! 🚀</button>
        <button class="num-btn action-btn btn-full" onclick="window.location.href='index.html'" style="font-size: 1.2rem;">ZURÜCK 🏠</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div id="fortschritt">Wird geladen...</div>
        <div id="aufgabe">...</div>
        <input type="text" id="antwort-input" placeholder="Antwort tippen..." autocomplete="off">
        <button class="num-btn ok-btn btn-full" onclick="pruefeAntwort()">PRÜFEN! ✅</button>
        <button class="num-btn action-btn btn-full" onclick="abbruch()" style="font-size: 1.2rem; background-color: var(--comic-pink);">ABBRECHEN ❌</button>
        <div id="feedback"></div>
    </div>

    <div id="end-screen" class="hidden">
        <h1>ERGEBNIS 🎉</h1>
        <div id="ergebnis-text"></div>
        <div id="gutschein-anzeige"></div>
        <button id="gutschein-btn" class="num-btn action-btn btn-full hidden" style="background: #4caf50; color: white;" onclick="erzeugeGutschein()">GUTSCHEIN HOLEN! 🎁</button>
        <button class="num-btn ok-btn btn-full" onclick="location.reload()" style="margin-top: 20px;">NOCHMAL 🔄</button>
        <button class="num-btn btn-full" onclick="window.location.href='index.html'" style="background: var(--comic-blue); color: white;">HAUPTMENÜ 🏠</button>
    </div>
</div>

<script>
    let alleDaten = {}, config = {}, lernStapel = [], fehlerListe = [];
    let aktuellerIndex = 0, score = 0, modus = "", erreichteNote = "6";

    document.getElementById('antwort-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') pruefeAntwort(); });

    // Gewählte Klasse merken, damit sie auch nach NOCHMAL (Neuladen) erhalten bleibt
    const klassenAuswahl = document.getElementById('klassen-stufe');
    try {
        const gespeicherteKlasse = localStorage.getItem('klassenStufe');
        if ([...klassenAuswahl.options].some(o => o.value === gespeicherteKlasse)) klassenAuswahl.value = gespeicherteKlasse;
    } catch (e) {}
    klassenAuswahl.addEventListener('change', () => {
        try { localStorage.setItem('klassenStufe', klassenAuswahl.value); } catch (e) {}
    });

    // Satzzeichen entfernen & Kleinschreibung
    function bereinigeText(text) {
        return text.replace(/\*/g, "").toLowerCase().replace(/[.,?!;:()'´`"/-]/g, "").replace(/\s+/g, " ").trim();
    }

    async function starteTraining() {
        try {
            const [vRes, cRes] = await Promise.all([
                fetch(klassenAuswahl.value + '?v=' + Date.now()),
                fetch('config.json?v=' + Date.now())
            ]);
            if (!vRes.ok) throw new Error("Vokabeldatei fehlt");
            alleDaten = await vRes.json();
            config = cRes.ok ? await cRes.json() : { 
                maxAlteWoerter: 8, 
                noten: { "1": 0.9, "2": 0.8, "3": 0.7, "4": 0.6, "5": 0.3, "6": 0.0 }, 
                belohnung: {"1": "60 Min. Switch", "2": "30 Min. Switch"} 
            };
            modus = document.getElementById('sprach-modus').value;
            erstelleLernstapel();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            zeigeVokabel();
        } catch (e) { alert("Fehler: " + e.message); }
    }

    function erstelleLernstapel() {
        const bloecke = Object.keys(alleDaten);
        const neuesterBlockKey = bloecke[bloecke.length - 1];
        let stapel = [];
        fehlerListe = [];
        aktuellerIndex = 0;
        score = 0;

        for (let en in alleDaten[neuesterBlockKey]) { 
            stapel.push({ en: en, de: alleDaten[neuesterBlockKey][en], block: neuesterBlockKey }); 
        }
        if (!config.nurAktuellerBlock) {
            let altePool = [];
            bloecke.slice(0, -1).forEach(b => { 
                for (let en in alleDaten[b]) { altePool.push({ en: en, de: alleDaten[b][en], block: b }); } 
            });
            altePool.sort(() => Math.random() - 0.5);
            stapel = stapel.concat(altePool.slice(0, config.maxAlteWoerter));
        }
        stapel.sort(() => Math.random() - 0.5);
        lernStapel = stapel;
    }

    function zeigeVokabel() {
        if (aktuellerIndex >= lernStapel.length) return zeigeEnde();
        const v = lernStapel[aktuellerIndex];
        const input = document.getElementById('antwort-input');
        input.value = ""; input.focus();
        document.getElementById('feedback').innerText = "";
        document.getElementById('fortschritt').innerText = `WORT ${aktuellerIndex + 1} / ${lernStapel.length}`;
        
        let r = (modus === "mix") ? (Math.random() > 0.5 ? "en_de" : "de_en") : modus;
        const anzeige = document.getElementById('aufgabe');

        if (r === "en_de") {
            anzeige.innerText = v.en;
            anzeige.dataset.ziel = "de";
        } else {
            const originalWoerter = v.de.filter(word => word.startsWith("*"));
            const gewaehltesWort = originalWoerter.length > 0 ? originalWoerter[Math.floor(Math.random() * originalWoerter.length)] : v.de[0];
            anzeige.innerText = gewaehltesWort.replace("*", "");
            anzeige.dataset.ziel = "en";
        }
    }

    function pruefeAntwort() {
        const inputRaw = document.getElementById('antwort-input').value.trim();
        if (inputRaw === "" || document.getElementById('quiz-screen').classList.contains('hidden')) return;
        
        const inputSafe = bereinigeText(inputRaw);
        const v = lernStapel[aktuellerIndex];
        const ziel = document.getElementById('aufgabe').dataset.ziel;
        
        let korrekt = false;
        if (ziel === "de") {
            korrekt = v.de.some(d => bereinigeText(d) === inputSafe);
        } else {
            korrekt = bereinigeText(v.en) === inputSafe;
        }

        if (korrekt) { 
            score++; 
            document.getElementById('feedback').innerText = "RICHTIG! 🌟"; 
            document.getElementById('feedback').style.color = "var(--comic-green)"; 
        } else { 
            let loesungenSauber = v.de.map(d => d.replace("*", ""));
            let l = (ziel === "de") ? loesungenSauber.join(", ") : v.en;
            document.getElementById('feedback').innerText = `LÖSUNG: ${l}`; 
            document.getElementById('feedback').style.color = "var(--comic-pink)";
            fehlerListe.push({ frage: document.getElementById('aufgabe').innerText, antwort: l });
        }
        aktuellerIndex++; 
        setTimeout(zeigeVokabel, 2000);
    }

    function zeigeEnde() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');
        const name = document.getElementById('spieler-name').value || "Held";
        const prozent = score / lernStapel.length;
        
        erreichteNote = "6";
        const sortierteNoten = Object.keys(config.noten).sort((a, b) => a - b);
        for (let n of sortierteNoten) { if (prozent >= config.noten[n]) { erreichteNote = n; break; } }
        
        const farbe = erreichteNote <= 2 ? "var(--comic-green)" : (erreichteNote <= 4 ? "var(--dark)" : "var(--comic-pink)");
        
        let html = `STARK, <b>${name}</b>!<br>Ergebnis: ${score} von ${lernStapel.length}`;
        html += `<div class="note-display" style="color: ${farbe}">NOTE: ${erreichteNote}</div>`;
        
        if (fehlerListe.length > 0) {
            html += `<div class="fehler-box"><h3>Deine Berichtigung:</h3><ul style="text-align: left; padding-left: 20px;">`;
            fehlerListe.forEach(f => {
                html += `<li style="margin-bottom: 8px;">❌ <b>${f.frage}</b> ➔ <span style="color: green;">${f.antwort}</span></li>`;
            });
            html += `</ul></div>`;
        } else {
            html += `<p style="color: var(--comic-green); font-weight: bold;">FEHLERFREI! Du bist ein Profi! 🏆</p>`;
        }
        
        if (erreichteNote === "1" || erreichteNote === "2") {
            document.getElementById('gutschein-btn').classList.remove('hidden');
        }
        document.getElementById('ergebnis-text').innerHTML = html;
    }

    function erzeugeGutschein() {
        const name = document.getElementById('spieler-name').value || "Held";
        const zeit = config.belohnung[erreichteNote] || "Bonuszeit";
        const jetzt = new Date();
        const stamp = jetzt.toLocaleDateString() + " um " + jetzt.toLocaleTimeString();
        const gDiv = document.getElementById('gutschein-anzeige');
        gDiv.innerHTML = `
            <div class="gutschein-titel">🎮 SWITCH-GUTSCHEIN 🎮</div>
            <div class="gutschein-zeit">${zeit}</div>
            <div>für den Helden: <b>${name}</b></div>
            <div class="gutschein-info">Gültig ab: ${stamp}<br>ID: ${Math.random().toString(36).substr(2, 9).toUpperCase()}</div>
        `;
        gDiv.style.display = "block";
        document.getElementById('gutschein-btn').classList.add('hidden');
    }

    function abbruch() { if (confirm("Abbrechen?")) window.location.href = 'index.html'; }
</script>
</body>
</html>
